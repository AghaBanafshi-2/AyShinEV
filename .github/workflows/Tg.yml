name: Notify Telegram on Index Change

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog from index.html
        id: changelog
        run: |
          CHANGES=$(sed -n '/CHANGELOG_START/,/CHANGELOG_END/p' index.html \
            | sed '/CHANGELOG_START/d; /CHANGELOG_END/d' \
            | sed 's/^[[:space:]]*//' \
            | sed '/^$/d')
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Message
        run: |
          AUTHOR="${{ github.event.head_commit.author.name }}"
          TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          URL="${{ github.event.head_commit.url }}"
          CHANGES="${{ steps.changelog.outputs.changes }}"
          
          if [ -z "$CHANGES" ]; then
            CHANGES="— لیست تغییرات خالی است —"
          fi
          
          TEXT="🔔 *سایت AyShinEV تغییر کرد!*
          
          🆕 *چیزهای جدید:*
          ${CHANGES}
          
          👤 *توسط:* ${AUTHOR}
          🕐 *زمان:* ${TIME}
          
          🔗 [مشاهده تغییرات](${URL})"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN_BOT }}/sendMessage" \
            -d "chat_id=${{ secrets.ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=${TEXT}"
